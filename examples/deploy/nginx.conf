# nginx / OpenResty server blocks for AgentNeuron on 127.0.0.1:4747.
# Certificates: certbot --nginx -d agentneuron.example.com   (or your panel's certificate tool)

server {
    listen 80;
    server_name agentneuron.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agentneuron.example.com;

    ssl_certificate     /etc/letsencrypt/live/agentneuron.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentneuron.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;

    # Optional: restrict to known addresses
    # allow 203.0.113.10;
    # deny  all;

    location / {
        proxy_pass http://127.0.0.1:4747;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Must reach AgentNeuron unchanged, or cookie logins fail the Origin/Host check
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (/api/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
