<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>AgentNeuron</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' %3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a4c'/%3E%3Cstop offset='0.5' stop-color='%23b86bff'/%3E%3Cstop offset='1' stop-color='%234f7dff'/%3E%3C/linearGradient%3E%3CradialGradient id='hl' cx='0.3' cy='0.2' r='0.9'%3E%3Cstop offset='0' stop-color='%23fff' stop-opacity='0.32'/%3E%3Cstop offset='0.6' stop-color='%23fff' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url%28%23bg%29'/%3E%3Crect width='32' height='32' rx='9' fill='url%28%23hl%29'/%3E%3Cg stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M9 25 16 7l7 18' stroke-width='2.3'/%3E%3Cpath d='M12 17.3c2.6-1.6 5.4-1.6 8 0' stroke-width='2'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Ccircle cx='16' cy='7' r='3'/%3E%3Ccircle cx='9' cy='25' r='2.3'/%3E%3Ccircle cx='23' cy='25' r='2.3'/%3E%3C/g%3E%3Ccircle cx='16' cy='7' r='1.2' fill='url%28%23bg%29'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = localStorage.getItem('agentneuron.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* Pre-JS splash: mirrors ui/src/lib/boot/BootScreen.svelte (same mark size and position) so the hand-over is seamless. */
      #splash { --vs: 260px; --vy: clamp(150px, 31vh, 290px); --bg: #07080d; --fg: #e8eaf1; --fg2: #a4aabb; --ring: rgba(164, 170, 187, 0.3); --a1: rgba(139, 125, 255, 0.16); --a2: rgba(255, 138, 76, 0.1);
        position: fixed; inset: 0; z-index: 210; background: var(--bg); color: var(--fg); overflow: hidden; transition: opacity 0.3s ease;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'Inter', 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, system-ui, sans-serif; }
      [data-theme='light'] #splash { --bg: #f4f5f9; --fg: #12141c; --fg2: #4b5163; --ring: rgba(75, 81, 99, 0.25); --a1: rgba(91, 78, 224, 0.1); --a2: rgba(217, 98, 43, 0.07); }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60vmax 40vmax at 50% var(--vy), var(--a1), transparent 70%), radial-gradient(40vmax 30vmax at 90% 100%, var(--a2), transparent 70%); }
      #splash .sv { position: absolute; left: 50%; top: var(--vy); width: var(--vs); height: var(--vs); transform: translate(-50%, -50%); }
      #splash .rg { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1px solid var(--ring); transform: translate(-50%, -50%); }
      #splash .r1 { width: 40%; height: 40%; }
      #splash .r2 { width: 67.5%; height: 67.5%; border-style: dashed; animation: sp-spin-c 40s linear infinite; }
      #splash .r3 { width: 91%; height: 91%; opacity: 0.5; border-style: dotted; animation: sp-spin-c 64s linear infinite reverse; }
      #splash .orb { position: absolute; inset: 16.25%; animation: sp-spin 3.6s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite; }
      #splash .orb i { position: absolute; left: 50%; top: -4px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #8b7dff; box-shadow: 0 0 14px #8b7dff; }
      #splash .orb.b { animation-duration: 5.2s; animation-direction: reverse; inset: 30%; }
      #splash .orb.b i { background: #ff8a4c; box-shadow: 0 0 14px #ff8a4c; width: 6px; height: 6px; margin-left: -3px; top: -3px; }
      #splash .mk { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 16px; box-shadow: 0 12px 40px -8px rgba(192, 123, 255, 0.55); animation: sp-breathe 2.4s ease-in-out infinite alternate; }
      #splash .mk svg { display: block; }
      #splash .tt { position: absolute; left: 0; right: 0; top: calc(var(--vy) + var(--vs) / 2 + 6px); text-align: center; padding: 0 16px; }
      #splash h1 { margin: 0; font-size: 20px; font-weight: 680; letter-spacing: -0.02em; line-height: 28px; }
      #splash p { margin: 2px 0 0; color: var(--fg2); font-size: 13px; line-height: 20px; }
      @media (max-width: 600px), (max-height: 700px) { #splash { --vs: 210px; --vy: clamp(130px, 28vh, 240px); } }
      @media (max-height: 560px) { #splash { --vs: 150px; --vy: 100px; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @keyframes sp-breathe { from { transform: scale(0.97); } to { transform: scale(1.03); } }
      @keyframes sp-spin-c { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading AgentNeuron">
      <div class="sv" aria-hidden="true">
        <span class="rg r1"></span><span class="rg r2"></span><span class="rg r3"></span>
        <span class="orb"><i></i></span><span class="orb b"><i></i></span>
        <span class="mk"><svg viewBox="0 0 32 32" width="56" height="56" ><defs><linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a4c"/><stop offset="0.5" stop-color="#b86bff"/><stop offset="1" stop-color="#4f7dff"/></linearGradient><radialGradient id="sp-hl" cx="0.3" cy="0.2" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="32" height="32" rx="9" fill="url(#sp-bg)"/><rect width="32" height="32" rx="9" fill="url(#sp-hl)"/><g stroke="#fff" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M9 25 16 7l7 18" stroke-width="2.3"/><path d="M12 17.3c2.6-1.6 5.4-1.6 8 0" stroke-width="2"/></g><g fill="#fff"><circle cx="16" cy="7" r="3"/><circle cx="9" cy="25" r="2.3"/><circle cx="23" cy="25" r="2.3"/></g><circle cx="16" cy="7" r="1.2" fill="url(#sp-bg)"/></svg></span>
      </div>
      <div class="tt"><h1>AgentNeuron</h1><p>Waking up your context</p></div>
      <noscript><p style="position:absolute;bottom:24px;left:0;right:0;text-align:center">AgentNeuron needs JavaScript to run.</p></noscript>
    </div>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
