name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows support is still being verified; its result is reported but does not block.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The UI toolchain (Vite 8 / Rolldown) needs Node >= 20.19 to build; the bundle itself runs on 18.
      - if: matrix.node != 18
        run: node scripts/build.mjs --strict
      - name: Smoke test
        if: matrix.node != 18
        shell: bash
        run: |
          node dist/agentneuron.mjs --version
          node dist/agentneuron.mjs status examples
      - if: matrix.node != 18
        run: npm pack --dry-run

  bundle-on-node18:
    name: Bundle runs on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs --strict
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Smoke test on Node 18
        run: |
          node --version
          node dist/agentneuron.mjs --version
          node dist/agentneuron.mjs status examples
          node dist/agentneuron.mjs lint --json examples/claude-code-project > /dev/null
