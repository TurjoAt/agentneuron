name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build.mjs --strict
      - name: Verify tag matches package.json
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if [ "v${VERSION}" != "${TAG}" ]; then echo "Tag ${TAG} does not match package.json version ${VERSION}"; exit 1; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Checksum
        run: |
          cd dist
          sha256sum agentneuron.mjs > agentneuron.mjs.sha256
          cat agentneuron.mjs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: chmod +x dist/agentneuron.mjs
      - name: Publish (skipped if this version already exists)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "agentneuron@$V" version >/dev/null 2>&1; then echo "agentneuron@$V already published"; else npm publish --provenance --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-packages:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Prepare scoped copy
        run: |
          mkdir pkg
          cp -r dist pkg/dist
          cp package.json README.md LICENSE pkg/
          [ -f CHANGELOG.md ] && cp CHANGELOG.md pkg/ || true
          chmod +x pkg/dist/agentneuron.mjs
          cd pkg
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.name = "@" + process.env.OWNER.toLowerCase() + "/agentneuron";
            p.publishConfig = { registry: "https://npm.pkg.github.com", access: "public" };
            delete p.scripts;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '
        env:
          OWNER: ${{ github.repository_owner }}
      - name: Publish (ignore already-published)
        working-directory: pkg
        run: npm publish || echo "publish skipped or already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: Attach assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to release (create if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/agentneuron.mjs dist/agentneuron.mjs.sha256 --clobber

  docker:
    name: Push Docker image to ghcr.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentneuron
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
