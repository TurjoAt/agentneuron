version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # chokidar 5+ requires Node 22.22+; agentneuron still supports Node 18 at runtime.
      - dependency-name: chokidar
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # Move the Node base image to a new major by hand, and only to an LTS line (odd majors such as 25 are not LTS).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
