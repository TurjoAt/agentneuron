name: Bug report
description: Something is not working as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! For security issues use a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. agentneuron start .
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentNeuron version
      description: Output of `agentneuron --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Docker, Other]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, Web UI, MCP server, Lint / health, Git / project intelligence, Actions, Docker, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove tokens and secrets first.
      render: shell
